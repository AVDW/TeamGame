<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#060a1a" />
  <title>Sprite Race — Dashboard</title>
  <link rel="stylesheet" href="/theme.css" />
  <style>
    /* Front-of-room dashboard. High-contrast, readable across a room.
       Shows only board-equivalent aggregates — no player→sprite mapping, so
       putting it on the big screen gives no player an advantage.
       Shared tokens/components come from theme.css; layout lives here. */
    body { overflow: hidden; }
    .wrap { height: 100vh; display: flex; flex-direction: column; padding: 2.2vh 2vw; gap: 1.6vh; }

    /* Header */
    header { display: flex; align-items: center; gap: 1.4vw; }
    .brand { font-size: clamp(20px, 2.4vw, 40px); white-space: nowrap; }
    .brand .rocket { margin-right: .4vw; }
    .tiles { margin-left: auto; display: flex; gap: 1vw; }
    .tile {
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 1vh 1.3vw; min-width: 8.5vw; text-align: center;
    }
    .tile .k { font-size: clamp(10px, .8vw, 14px); color: var(--ink-3); text-transform: uppercase; letter-spacing: .08em; font-weight: 700; }
    .tile .v { font-size: clamp(22px, 2.6vw, 46px); font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1.05; }

    /* Body: board + side panel (board CSS scoped to #canvas — not the confetti overlay) */
    .body { flex: 1; display: flex; gap: 1.6vw; min-height: 0; }
    .hidden { display: none !important; }
    .raceview { flex: 1; display: flex; gap: 1.6vw; min-height: 0; }
    .boardWrap {
      position: relative;
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg);
      padding: 1.4vh 1.4vh; display: flex; align-items: center; justify-content: center; min-width: 0;
    }
    #canvas { height: 100%; width: auto; max-width: 100%; border-radius: 12px; background: #070b1e; display: block; }

    /* 3·2·1 countdown, centred over the board */
    .countdown { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; pointer-events: none; }
    .countdown.show { display: flex; }
    .countdown .num { font-size: clamp(120px, 24vh, 340px); font-weight: 900; color: var(--accent); text-shadow: 0 0 50px rgba(76,201,240,.7); animation: pop .4s ease; }
    .countdown .num.go { color: var(--good); text-shadow: 0 0 50px rgba(52,211,153,.7); }
    @keyframes pop { 0% { transform: scale(.4); opacity: 0; } 45% { transform: scale(1.15); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }

    /* Lobby / setup view */
    .lobbyview { flex: 1; display: flex; gap: 1.6vw; min-height: 0; }
    .joinpanel { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 1.4vh; padding: 2vh; }
    .joinpanel h2 { font-size: clamp(14px, 1.4vw, 24px); }
    .setuppanel { width: 32vw; max-width: 520px; padding: 2.4vh 2vw; display: flex; flex-direction: column; }
    .setuppanel h2 { font-size: clamp(14px, 1.4vw, 24px); margin-bottom: 2vh; }
    .cfg { margin-bottom: 2.2vh; }
    .cfg > label { display: block; font-size: clamp(11px, .9vw, 15px); color: var(--ink-3); text-transform: uppercase; letter-spacing: .08em; font-weight: 700; margin-bottom: .9vh; }
    .seg { display: flex; gap: .6vw; }
    .seg button { flex: 1; padding: 1.3vh .3vw; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); color: var(--ink-2); font-size: clamp(13px, 1.1vw, 20px); font-weight: 800; font-family: var(--font); cursor: pointer; }
    .seg button.on { background: linear-gradient(135deg, var(--accent), #2a9fd8); color: #04121f; border-color: transparent; box-shadow: var(--glow-accent); }
    .stepper { display: flex; align-items: center; gap: .8vw; }
    .stepper button { width: clamp(48px, 4.5vw, 68px); padding: 1.2vh 0; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); color: var(--accent); font-size: clamp(22px, 2vw, 32px); font-weight: 900; font-family: var(--font); line-height: 1; cursor: pointer; }
    .stepper button:disabled { color: var(--ink-3); opacity: .45; cursor: default; }
    .stepper button:active:not(:disabled) { background: var(--accent-2); color: #04121f; }
    .stepval { flex: 1; text-align: center; font-size: clamp(24px, 2.6vw, 44px); font-weight: 900; font-variant-numeric: tabular-nums; }
    .setuppanel .btn-primary { margin-top: auto; }
    #startHint { margin-top: 1.2vh; }

    .side { width: 34vw; max-width: 560px; display: flex; flex-direction: column; gap: 1.6vh; min-height: 0; }
    .panel { padding: 1.6vh 1.3vw; }
    .panel h2 { font-size: clamp(12px, 1vw, 16px); margin-bottom: 1.2vh; }

    /* Leaderboard */
    .board-list { flex: 1; overflow: hidden; }
    .row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: .9vw; padding: 1.05vh 0; border-top: 1px solid var(--line); }
    .row:first-of-type { border-top: none; }
    .rank { font-size: clamp(16px, 1.5vw, 26px); font-weight: 900; color: var(--ink-3); width: 2.4vw; text-align: center; font-variant-numeric: tabular-nums; }
    .row.lead .rank { color: var(--warn); }
    .who { min-width: 0; }
    .name { display: flex; align-items: center; gap: .6vw; font-size: clamp(15px, 1.5vw, 27px); font-weight: 800; }
    .name .swatch { width: 1.4vw; height: 1.4vw; min-width: 14px; min-height: 14px; border-radius: 5px; }
    .bar { margin-top: .7vh; height: 1.2vh; min-height: 9px; }
    .meta { text-align: right; white-space: nowrap; }
    .pct { font-size: clamp(15px, 1.5vw, 27px); font-weight: 900; font-variant-numeric: tabular-nums; }
    .crash { font-size: clamp(10px, .85vw, 15px); color: var(--ink-3); font-weight: 700; }
    .finflag { font-size: clamp(14px, 1.3vw, 24px); }

    /* Activity meter */
    .activity { display: flex; align-items: center; gap: 1.2vw; }
    .apm { text-align: center; }
    .apm .v { font-size: clamp(26px, 3.4vw, 60px); font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1; }
    .apm .k { font-size: clamp(9px, .8vw, 13px); color: var(--ink-3); text-transform: uppercase; letter-spacing: .08em; font-weight: 700; margin-top: .4vh; }
    .spark { flex: 1; display: flex; align-items: flex-end; gap: 3px; height: 7vh; }
    .spark > i { flex: 1; background: linear-gradient(180deg, var(--accent), var(--accent-2)); border-radius: 3px 3px 0 0; height: 4%; transition: height .18s ease; }

    /* Overlays: lobby + finished */
    .overlay { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 4vh; background: rgba(6,10,26,.78); backdrop-filter: blur(4px); }
    .overlay.show { display: flex; }
    .overlay h1 { font-size: clamp(30px, 5vw, 80px); font-weight: 900; margin: 0 0 1.5vh; }
    .overlay p { font-size: clamp(15px, 1.8vw, 30px); color: var(--ink-2); }
    .joins { margin-top: 3vh; display: flex; flex-wrap: wrap; gap: .8vw; justify-content: center; max-width: 80vw; }
    .joins .chip { padding: .7vh 1.1vw; font-size: clamp(13px, 1.2vw, 22px); font-weight: 700; }
    .big-num { font-size: clamp(48px, 9vw, 150px); font-weight: 900; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; text-shadow: 0 0 24px rgba(76,201,240,.4); }
    /* Join box: QR + URL */
    .joinbox { display: flex; align-items: center; gap: 3vw; margin: 1vh 0 1vh; flex-wrap: wrap; justify-content: center; }
    .qrframe { background: #fff; padding: 1.6vh; border-radius: var(--radius-lg); box-shadow: 0 12px 40px rgba(0,0,0,.5), var(--glow-accent); }
    .qrframe canvas { display: block; width: clamp(140px, 20vh, 230px); height: clamp(140px, 20vh, 230px); image-rendering: pixelated; }
    .joininfo { text-align: left; }
    .joinurl { font-family: var(--font-mono); font-size: clamp(18px, 2.2vw, 40px); font-weight: 800; color: #fff; background: var(--surface-2); border: 1px solid var(--line); padding: 1.2vh 1.6vw; border-radius: 12px; word-break: break-all; }
    .joincount { margin-top: 1vh; display: flex; align-items: center; gap: 1vw; justify-content: center; }
    .joincount .big-num { font-size: clamp(30px, 4vw, 60px); }
    .podium { margin-top: 2vh; display: flex; flex-direction: column; gap: 1vh; min-width: 40vw; }
    .podium .row { border: none; background: var(--surface); border-radius: 12px; padding: 1.4vh 1.4vw; }
    .dim { color: var(--ink-3); font-size: clamp(12px, 1vw, 18px); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand"><span class="rocket">🚀</span><span class="title-glow">Sprite Race</span></div>
      <div class="tiles">
        <div class="tile"><div class="k">Players</div><div class="v" id="tPlayers">0</div></div>
        <div class="tile"><div class="k">Teams</div><div class="v" id="tTeams">0</div></div>
        <div class="tile"><div class="k">Time</div><div class="v timer" id="tTime">–</div></div>
      </div>
    </header>

    <div class="body">
      <!-- Race view — board + live stats (during countdown and racing) -->
      <div id="raceView" class="raceview hidden">
        <div class="boardWrap">
          <canvas id="canvas" width="400" height="600"></canvas>
          <div id="countdown" class="countdown"></div>
        </div>
        <div class="side">
          <div class="panel board-list" style="flex:1; display:flex; flex-direction:column;">
            <h2>Standings — who's in the lead</h2>
            <div id="rows" style="flex:1;"></div>
          </div>
          <div class="panel">
            <h2>Input activity</h2>
            <div class="activity">
              <div class="apm"><div class="v" id="apm">0</div><div class="k">inputs / sec</div></div>
              <div class="spark" id="spark"></div>
              <div class="apm"><div class="v" id="total">0</div><div class="k">total inputs</div></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Lobby / setup view — join info + game configuration (before a race) -->
      <div id="lobbyView" class="lobbyview">
        <div class="panel joinpanel">
          <h2>📱 Scan to join</h2>
          <div class="qrframe"><canvas id="qr"></canvas></div>
          <div class="joinurl" id="joinUrl">…</div>
          <div class="joincount"><span class="big-num" id="lobbyCount">0</span><span class="dim">pilots ready</span></div>
          <div class="joins" id="joins"></div>
        </div>
        <div class="panel setuppanel">
          <h2>Game setup</h2>
          <div class="cfg">
            <label>Race length</label>
            <div class="stepper" id="stepTime">
              <button type="button" id="timeMinus" aria-label="Less time">−</button>
              <div class="stepval" id="timeVal">2:00</div>
              <button type="button" id="timePlus" aria-label="More time">+</button>
            </div>
          </div>
          <div class="cfg">
            <label>Difficulty</label>
            <div class="seg" id="segDiff">
              <button data-v="easy">Easy</button><button data-v="normal" class="on">Normal</button><button data-v="hard">Hard</button>
            </div>
          </div>
          <div class="cfg">
            <label>Teams</label>
            <div class="seg" id="segTeams">
              <button data-v="auto" class="on">Auto</button><button data-v="2">2</button><button data-v="3">3</button><button data-v="4">4</button>
            </div>
          </div>
          <button class="btn-primary" id="startBtn" disabled>🚀 Launch Race</button>
          <div class="muted" id="startHint">Waiting for pilots to join…</div>
        </div>
      </div>
    </div>
  </div>

  <canvas id="confetti" style="position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:80;"></canvas>

  <!-- Finished overlay -->
  <div class="overlay" id="finished">
    <h1 id="winBanner"></h1>
    <div class="podium" id="podium"></div>
    <button class="btn-primary" id="newRaceBtn" style="max-width:360px; margin-top:3vh;">🔄 New Race</button>
  </div>

  <script src="/qrcode.js"></script>
  <script src="/board.js"></script>
  <script src="/confetti.js"></script>
  <script>
    let leadTeam = null;

    // ---- join QR code ----
    // Players join at the site root; the dashboard lives at /display. Encode the
    // root URL so a phone scan opens the game directly. Rendered locally from a
    // vendored library — no external service.
    function renderJoin() {
      const joinUrl = location.origin + '/';
      document.getElementById('joinUrl').textContent = location.host + '/';
      try {
        const qr = qrcode(0, 'M');       // type 0 = auto-size, medium error correction
        qr.addData(joinUrl);
        qr.make();
        const n = qr.getModuleCount(), margin = 4, scale = 8;
        const px = (n + margin * 2) * scale;
        const cv = document.getElementById('qr');
        cv.width = cv.height = px;
        const c = cv.getContext('2d');
        c.fillStyle = '#ffffff'; c.fillRect(0, 0, px, px);
        c.fillStyle = '#060a1a';
        for (let r = 0; r < n; r++) for (let col = 0; col < n; col++) {
          if (qr.isDark(r, col)) c.fillRect((col + margin) * scale, (r + margin) * scale, scale, scale);
        }
      } catch (e) { /* qrcode lib missing — the URL text is still shown */ }
    }

    // ---- websocket (spectator) ----
    let ws;
    function connect() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(`${proto}://${location.host}/ws`);
      ws.onopen = () => ws.send(JSON.stringify({ type: 'spectate' }));
      ws.onclose = () => setTimeout(connect, 1500);
      ws.onmessage = (e) => handle(JSON.parse(e.data));
    }
    function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }
    function show(id, on) { document.getElementById(id).classList.toggle('show', on); }
    function showView(name) {
      document.getElementById('raceView').classList.toggle('hidden', name !== 'race');
      document.getElementById('lobbyView').classList.toggle('hidden', name !== 'lobby');
    }

    // ---- game configuration (dashboard-only; sent with the start command) ----
    const cfg = { seconds: 120, difficulty: 'normal', teams: 'auto' };
    function wireSeg(id, key, cast) {
      const seg = document.getElementById(id);
      seg.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => {
        seg.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
        cfg[key] = cast(b.dataset.v);
      }));
    }
    wireSeg('segDiff', 'difficulty', (v) => v);
    wireSeg('segTeams', 'teams', (v) => (v === 'auto' ? 'auto' : Number(v)));

    // Race length stepper: adjustable in 30s steps, 0:30 up to 5:00.
    const TIME_MIN = 30, TIME_MAX = 300, TIME_STEP = 30;
    const fmtClock = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    function renderTime() {
      document.getElementById('timeVal').textContent = fmtClock(cfg.seconds);
      document.getElementById('timeMinus').disabled = cfg.seconds <= TIME_MIN;
      document.getElementById('timePlus').disabled = cfg.seconds >= TIME_MAX;
    }
    document.getElementById('timeMinus').addEventListener('click', () => { cfg.seconds = Math.max(TIME_MIN, cfg.seconds - TIME_STEP); renderTime(); });
    document.getElementById('timePlus').addEventListener('click', () => { cfg.seconds = Math.min(TIME_MAX, cfg.seconds + TIME_STEP); renderTime(); });
    renderTime();
    document.getElementById('startBtn').addEventListener('click', () => send({ type: 'start', config: cfg }));
    document.getElementById('newRaceBtn').addEventListener('click', () => send({ type: 'reset' }));

    // ---- 3·2·1 countdown overlay ----
    function showCountdown(n) {
      const el = document.getElementById('countdown');
      el.classList.add('show');
      el.innerHTML = n > 0 ? `<span class="num">${n}</span>` : `<span class="num go">GO!</span>`;
      if (n === 0) setTimeout(() => el.classList.remove('show'), 700);
    }

    // ---- input-rate tracking ----
    let lastInputs = 0, lastT = 0, apmEMA = 0;
    const sparks = [];
    const SPARK_N = 28;
    (function initSpark(){ const s = document.getElementById('spark'); for (let i=0;i<SPARK_N;i++){ const b=document.createElement('i'); s.appendChild(b); sparks.push(b); } })();

    function handle(msg) {
      if (msg.type === 'lobby') {
        confetti.stop();
        board.stop();
        show('finished', false);
        showView('lobby');
        const c = msg.count;
        document.getElementById('lobbyCount').textContent = c;
        document.getElementById('tPlayers').textContent = c;
        document.getElementById('tTeams').textContent = '–';
        document.getElementById('tTime').textContent = '–';
        document.getElementById('joins').innerHTML = msg.names.map(n => `<span class="chip">${esc(n)}</span>`).join('');
        document.getElementById('startBtn').disabled = c < 1;
        document.getElementById('startHint').textContent =
          c < 1 ? 'Waiting for pilots to join…' : c < 2 ? 'Add more pilots for a race — or launch a solo run.' : 'Ready when you are.';
        lastInputs = 0; apmEMA = 0;
      }
      else if (msg.type === 'countdown') {
        confetti.stop();
        show('finished', false);
        showView('race');
        board.start();
        showCountdown(msg.n);
      }
      else if (msg.type === 'state') {
        confetti.stop();
        show('finished', false);
        showView('race');
        updateStats(msg);
        renderLeaderboard(msg.sprites);
        board.update(msg);  // smoothly interpolated by the render loop
        board.start();
      }
      else if (msg.type === 'end') {
        board.stop();
        renderFinished(msg);
        show('finished', true);
        const wc = msg.standings && msg.standings[0] ? msg.standings[0].color : null;
        confetti.launch(wc ? [wc] : null);
      }
      else if (msg.type === 'inprogress') {
        showView('race');
        board.start();
      }
    }

    function updateStats(msg) {
      document.getElementById('tPlayers').textContent = msg.players;
      document.getElementById('tTeams').textContent = msg.sprites.length;
      const t = msg.timer;
      const timeEl = document.getElementById('tTime');
      timeEl.textContent = `${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`;
      timeEl.classList.toggle('low', t <= 15);

      // inputs/sec from the aggregate counter delta (reveals nothing about who).
      const now = performance.now();
      if (lastT) {
        const dt = (now - lastT) / 1000;
        const rate = dt > 0 ? Math.max(0, (msg.inputs - lastInputs) / dt) : 0;
        apmEMA = apmEMA * 0.6 + rate * 0.4;
      }
      lastT = now; lastInputs = msg.inputs;
      document.getElementById('apm').textContent = Math.round(apmEMA);
      document.getElementById('total').textContent = msg.inputs;
      pushSpark(apmEMA);
    }
    const sparkVals = [];
    function pushSpark(v) {
      sparkVals.push(v); if (sparkVals.length > SPARK_N) sparkVals.shift();
      const peak = Math.max(6, ...sparkVals);
      for (let i = 0; i < sparks.length; i++) {
        const val = sparkVals[sparkVals.length - sparks.length + i] || 0;
        sparks[i].style.height = Math.max(4, (val / peak) * 100) + '%';
      }
    }

    function renderLeaderboard(list) {
      const ranked = list.map(s => ({ ...s })).sort((a, b) => Number(b.finished) - Number(a.finished) || b.progress - a.progress);
      leadTeam = ranked.length ? ranked[0].team : null;
      document.getElementById('rows').innerHTML = ranked.map((s, i) => `
        <div class="row ${i === 0 ? 'lead' : ''}">
          <div class="rank">${i === 0 ? '👑' : (i + 1)}</div>
          <div class="who">
            <div class="name"><span class="swatch" style="background:${s.color}; color:${s.color}"></span>${esc(s.name)}</div>
            <div class="bar"><span style="width:${Math.round(s.progress*100)}%; background:${s.color}"></span></div>
          </div>
          <div class="meta">
            <div class="pct">${s.finished ? '<span class="finflag">🏁</span>' : Math.round(s.progress*100) + '%'}</div>
            <div class="crash">${s.bump} crash${s.bump === 1 ? '' : 'es'}</div>
          </div>
        </div>`).join('');
    }

    function renderFinished(msg) {
      const b = document.getElementById('winBanner');
      b.innerHTML = msg.winnerName ? `🏆 ${esc(msg.winnerName)} team wins!` : "⏱ Time's up!";
      const st = msg.standings || [];
      document.getElementById('podium').innerHTML = st.map((s, i) => `
        <div class="row">
          <div class="rank">${['🥇','🥈','🥉'][i] || (i+1)}</div>
          <div class="who"><div class="name"><span class="swatch" style="background:${s.color}; color:${s.color}"></span>${esc(s.name)}</div></div>
          <div class="meta"><div class="pct">${s.finished ? '🏁' : Math.round(s.progress*100)+'%'}</div><div class="crash">${s.bump} crashes</div></div>
        </div>`).join('');
    }

    // ---- board + confetti rendering (shared renderers in board.js / confetti.js) ----
    const board = Board.attach(document.getElementById('canvas'), { showLead: true });
    const confetti = Confetti.attach(document.getElementById('confetti'), { count: 240, duration: 6500 });

    function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

    renderJoin();
    showView('lobby');
    connect();
  </script>
</body>
</html>
