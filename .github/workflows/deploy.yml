name: Deploy to Cloudflare Workers

# Deploys the Worker + Durable Object to Cloudflare.
#  * Automatically on every push to `main`.
#  * Manually from any branch via the "Run workflow" button (Actions tab),
#    handy for deploying this feature branch before it's merged.
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # Avoid stacking deploys on rapid pushes.
    concurrency:
      group: deploy-cloudflare
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
